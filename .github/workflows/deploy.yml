name: Deploy Discord Bot

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    env:
      BOT_DIR: F:\git\ponzu-sababot\bot
      GIT_TERMINAL_PROMPT: 0
    steps:
      - name: Pull latest code
        working-directory: ${{ env.BOT_DIR }}
        run: |
          $token = "${{ secrets.GITHUB_TOKEN }}"
          $repo = "${{ github.repository }}"
          # URL指定の fetch は origin/main を更新しないため FETCH_HEAD を使う
          git fetch "https://x-access-token:${token}@github.com/${repo}.git" main
          git reset --hard FETCH_HEAD
          git log --oneline -1
        shell: powershell

      - name: Stop Bot (release file locks)
        continue-on-error: true
        run: pm2 stop ponzubot
        shell: powershell

      - name: Wait for process cleanup
        run: Start-Sleep -Seconds 3
        shell: powershell

      - name: Install dependencies
        working-directory: ${{ env.BOT_DIR }}
        run: npm install --ignore-scripts

      - name: Type check
        working-directory: ${{ env.BOT_DIR }}
        run: npm run typecheck

      - name: Deploy commands
        working-directory: ${{ env.BOT_DIR }}
        run: npm run deploy

      - name: Start Bot
        working-directory: ${{ env.BOT_DIR }}
        run: pm2 restart ecosystem.config.cjs --env production
